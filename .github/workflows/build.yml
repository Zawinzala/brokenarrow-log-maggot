name: 打包 EXE（自动构建）

on:
  push:
    tags:
      - 'v*'            # 推送 v3.0.0 这类标签时自动打包并发布
  workflow_dispatch: {} # 也可在 GitHub 页面手动点 Run workflow

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm install

      - name: 打包（nsis 安装版 + portable 便携版）
        run: npm run dist

      - name: 上传构建产物（工作流页面可下载）
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/

      - name: 创建 GitHub Release（仅打标签时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
